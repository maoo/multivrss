# MultivRSS web app + feed-sync worker. One image, two Machines.
# Redis is a separate private app: fly.redis.toml.
# Postgres is created with `fly postgres create`, then attached.
# Walkthrough: SELF_HOSTING.md, section 11.
#
# `app` must be globally unique on Fly. If `multivrss` is taken, rename it
# here and in the `fly apps create` / secrets commands. Keep `primary_region`
# identical to fly.redis.toml.

app = "multivrss"
primary_region = "ams"

kill_signal = "SIGTERM"
kill_timeout = 30
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Fly's private DNS (.internal / .flycast) is IPv6-only.
  NODE_OPTIONS = "--dns-result-order=ipv6first"
  # Fly sets HOSTNAME to the machine name. Next's standalone server binds to
  # HOSTNAME, so this must be 0.0.0.0 or the proxy cannot reach the process.
  # The app process below sets it again because the platform value can win
  # over [env].
  HOSTNAME = "0.0.0.0"
  # Must match the `app` name in fly.redis.toml.
  REDIS_HOST = "multivrss-redis.internal"
  REDIS_PORT = "6379"

[processes]
  app = "sh -c 'HOSTNAME=0.0.0.0 exec node server.js'"
  worker = "node dist/worker.js"

[deploy]
  release_command = "npx prisma migrate deploy"
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
